name: Check Go and pnpm

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    # WailBrew ships for macOS only. Wails v3 compiles its Linux backend by
    # default, so an Ubuntu job would need ~20 min of GTK/WebKitGTK installs.
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Run frontend tests
        run: pnpm run test
        working-directory: frontend

      - name: Lint frontend
        run: pnpm run lint
        working-directory: frontend

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify generated bindings are up to date
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          wails3 generate bindings -ts -clean=true
          git add -N frontend/bindings
          git diff --exit-code -- frontend/bindings

      - name: Verify Go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build Go
        run: go build ./...

      - name: Run Go tests
        run: go test ./...

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
