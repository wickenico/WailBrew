name: Check Go and pnpm

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Run frontend tests
        run: pnpm run test
        working-directory: frontend

      - name: Lint frontend
        run: pnpm run lint
        working-directory: frontend

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Wails v3 compiles its Linux backend by default (v2 needed -tags desktop),
      # so cgo needs the GTK4/WebKitGTK 6 headers for build, test and lint.
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Verify generated bindings are up to date
        if: runner.os == 'macOS'
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          wails3 generate bindings -ts -clean=true
          git add -N frontend/bindings
          git diff --exit-code -- frontend/bindings

      - name: Verify Go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build Go
        run: go build ./...

      - name: Run Go tests
        run: go test ./...

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
